<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ACMUN Admin</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
    --blue: #004a6f;
    --blue-dark: #002f47;
    --black: #111111;

    /* Lighter, more elegant gold */
    --gold: #d8b56a;
    --gold-light: #efd28c;

    --cream: #f5f0e6;
    --white: #ffffff;

    --text: #1d1d1d;
    --muted: #777777;
    --border: #d8d8d8;
    --primary: #004a6f;
    --primary-dark: #002f47;
}
        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

                background: var(--cream);
                color: var(--text);

            min-height: 100vh;
        }


        /* ==============================
           HEADER
        ============================== */

        .header {
            height: 72px;

            background: var(--blue-dark);
            border-bottom: 2px solid var(--gold);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 35px;

            position: sticky;

            top: 0;

            z-index: 100;

            color: white;
        }

        .brand {
            display: flex;

            align-items: center;

            gap: 15px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;

            border:
                1px solid rgba(255,255,255,.8);

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 10px;

            font-weight: bold;

            letter-spacing: 1px;
        }

        .brand h1 {
            font-size: 19px;

            font-weight: 600;
        }

        .brand p {
            margin-top: 3px;

            font-size: 12px;

            opacity: .75;
        }


        /* ==============================
           DASHBOARD
        ============================== */

        .dashboard {
            max-width: 1200px;

            margin:
                0 auto;

            padding:
                35px 25px 70px;
        }


        .dashboard-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 25px;

            gap: 20px;
        }

        .dashboard-header h2 {
            font-size: 28px;

            font-weight: 500;
        }

        .dashboard-header p {
            color: var(--muted);

            margin-top: 6px;

            font-size: 14px;
        }


        /* ==============================
           STATS
        ============================== */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 25px;
        }

        .stat {
            background: var(--blue-dark);

            border-radius: 8px;

            padding: 22px;

            box-shadow:
                0 1px 3px
                rgba(0,0,0,.1);
        }

        .stat-label {
            color: var(--muted);

            font-size: 13px;

            margin-bottom: 10px;
        }

        .stat-value {
            color: var(--gold);

            font-size: 28px;

            font-weight: 600;
        }


        /* ==============================
           SEARCH
        ============================== */

        .toolbar {
            background: var(--blue-dark);

            border-radius: 8px;

            padding: 18px;
            color: var(--gold);
            margin-bottom: 20px;

            box-shadow:
                0 1px 3px
                rgba(0,0,0,.1);
        }

        .search {
            width: 100%;
            background-color: var(--blue-dark);
            border:
                1px solid var(--border);

            border-radius: 6px;

            padding: 13px 15px;

            font-size: 14px;

            outline: none;

            color: var(--gold);
        }

        .search::placeholder {
            color: var(--gold);
            opacity: 1;
        }

        .search:focus {
            border-color:
                var(--gold);
        }


        /* ==============================
           TEAM GRID
        ============================== */
/* =========================================
   REGISTERED TEAMS - COLUMN SHEET
========================================= */

#teamGrid {

width: 100%;

display: flex;

flex-direction: column;

gap: 2px;

}


/* COLUMN HEADINGS */

.team-table-header {

display: grid;

grid-template-columns:
    55px
    1.5fr
    1.5fr
    100px
    1.3fr
    100px
    110px
    130px;

align-items: center;

padding: 0 20px;

min-height: 42px;

color: #777;

font-size: 10px;

font-weight: 700;

text-transform: uppercase;
background-color: black;
letter-spacing: 0.8px;

}


/* TEAM ROW */

.team-card {

display: grid;

grid-template-columns:
    55px
    1.5fr
    1.5fr
    100px
    1.3fr
    100px
    110px
    130px;

align-items: center;

width: 100%;

min-height: 35px;

padding: 0 20px;

    background: var(--muted);
    border: 1px solid rgba(0, 74, 111, 0.18);
    border-left: 4px solid var(--gold);

border-radius: 4px;

cursor: pointer;

transition:
    background 0.2s ease,
    transform 0.2s ease,
    border-color 0.2s ease;

}


.team-card:hover {

background: #f7fafc;

border-color: #004a6f;

}


/* INDEX */

.team-index {

font-size: 12px;

font-weight: 700;

color: #004a6f;

}


/* ALL DATA COLUMNS */

.team-column {

min-width: 0;

padding-right: 15px;

font-size: 13px;

color: #555;

white-space: nowrap;

overflow: hidden;

text-overflow: ellipsis;

}


/* DELEGATION NAME */

.team-delegation {

color: #202124;

font-weight: 600;

}


/* INSTITUTION */

.team-institution {

color: #555;

}


/* HEAD DELEGATE */

.team-head {

color: #444;

}


/* PAYMENT */

.team-payment {

font-weight: 600;

color: #004a6f;

}


/* DATE */

.team-date {

font-size: 12px;

color: #777;

}


/* STATUS */

.status {

display: inline-flex;

align-items: center;

justify-content: center;

padding: 5px 10px;

border-radius: 20px;

font-size: 10px;

font-weight: 700;

}


.status.pending {

background: #fff4d6;

color: #9a6700;

}


.status.completed {

background: #e4f5eb;

color: #18794e;

}

        .info-label {
            color: var(--muted);

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: .5px;

            margin-bottom: 4px;
        }

        .info-value {
            font-size: 14px;

            font-weight: 500;
        }


        /* ==============================
           MODAL
        ============================== */

        .modal {
            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.45);

            z-index: 1000;

            display: none;

            overflow-y: auto;

            padding: 35px 15px;
        }

        .modal.open {
            display: block;
        }

        .modal-content {
            max-width: 900px;

            margin: auto;

            background: white;

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 15px 50px
                rgba(0,0,0,.25);
        }


        /* ==============================
           MODAL HEADER
        ============================== */

        .modal-header {
            background:
                var(--black);

            color: white;

            padding: 25px 30px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;
        }

        .modal-header h2 {
            font-size: 22px;

            font-weight: 500;
        }

        .modal-header p {
            font-size: 13px;

            opacity: .75;

            margin-top: 5px;
        }

        .close {
            background:
                rgba(255,255,255,.12);

            color: white;

            width: 38px;
            height: 38px;

            border: none;

            border-radius: 50%;

            cursor: pointer;

            font-size: 20px;
        }


        /* ==============================
           EDITOR
        ============================== */

        .editor {
            padding: 30px;
            background-color: var(--blue-dark);
        }

        .section {
            margin-bottom: 35px;
        }

        .section-title {
            color: var(--cream);

            font-size: 17px;

            font-weight: 600;

            padding-bottom: 10px;

            margin-bottom: 20px;

            border-bottom:
                1px solid var(--border);
        }

        .fields {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                18px 22px;
        }

        .field.full {
            grid-column:
                1 / -1;
        }

        .field label {
            display: block;

            font-size: 12px;

            font-weight: 600;

            color: var(--muted);

            margin-bottom: 7px;
        }

        .field input,
        .field select {
            width: 100%;

            padding: 12px;

            border:
                1px solid var(--border);

            border-radius: 6px;

            font-size: 14px;

            outline: none;

            background: var(--cream);
        }

        .field input:focus,
        .field select:focus {
            border-color:
                var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(0,74,111,.08);
        }


        /* ==============================
           PAYMENT
        ============================== */

        .payment-box {
            background:
                #f4f8fa;

            border:
                1px solid #d7e4ea;

            border-radius: 8px;

            padding: 20px;
        }

        .payment-box .fields {
            margin: 0;
        }


        /* ==============================
           DELEGATES
        ============================== */

        .delegate-editor {
            border:
                1px solid var(--border);

            border-radius: 7px;

            padding: 20px;

            margin-bottom: 15px;
        }

        .delegate-editor h4 {
            color: var(--primary);

            margin-bottom: 18px;

            font-size: 15px;
        }


        /* ==============================
           MODAL FOOTER
        ============================== */

        .modal-footer {
            padding:
                20px 30px;

            border-top:
                1px solid var(--border);

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;
        }

        .save-btn {
            background:
                var(--primary);

            color: white;

            border: none;

            border-radius: 6px;

            padding:
                12px 22px;

            font-weight: 600;

            cursor: pointer;
        }

        .payment-email-btn {
            background: #b89b4e;
            color: #111111;
            border: none;
            border-radius: 6px;
            padding: 12px 22px;
            font-weight: 700;
            cursor: pointer;
        }

        .payment-email-btn:hover {
            background: #d8b56a;
        }

        .save-btn:disabled,
        .complete-btn:disabled,
        .payment-email-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .complete-btn {
            background:
                #137333;

            color: white;

            border: none;

            border-radius: 6px;

            padding:
                12px 22px;

            font-weight: 600;

            cursor: pointer;
        }

        .complete-btn:hover {
            background:
                #0d5c28;
        }

        .save-btn:hover {
            background:
                var(--primary-dark);
        }


        /* ==============================
           EMPTY
        ============================== */

        .empty {
            text-align: center;

            padding: 60px;

            color: var(--muted);

            background: white;

            border-radius: 8px;
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media(max-width: 750px) {

            .header {
                padding:
                    0 18px;
            }

            .dashboard {
                padding:
                    25px 12px 50px;
            }

            .stats {
                grid-template-columns:
                    1fr;
            }

            .team-grid {
                grid-template-columns:
                    1fr;
            }

            .fields {
                grid-template-columns:
                    1fr;
            }

            .field.full {
                grid-column:
                    auto;
            }

            .editor {
                padding: 20px;
            }

            .modal-footer {
                flex-direction: column-reverse;
                align-items: stretch;
            }

            .modal-footer button {
                width: 100%;
            }

            @media (max-width: 900px) {

#teamGrid {

    overflow-x: auto;

}


.team-table-header,
.team-card {

    min-width: 1000px;

}

}
        }

    </style>

</head>


<body>


    <!-- ======================================
         HEADER
    ======================================= -->

    <header class="header">

        <div class="brand">

            <div class="brand-logo">
                ACMUN
            </div>

            <div>

                <h1>
                    ACMUN Administration
                </h1>

                <p>
                    Delegation Registration Management
                </p>

            </div>

        </div>

    </header>



    <!-- ======================================
         DASHBOARD
    ======================================= -->

    <main class="dashboard">


        <div class="dashboard-header">

            <div>

                <h2>
                    Registrations
                </h2>

                <p>
                    Manage ACMUN delegation registrations.
                </p>

            </div>

        </div>


        <!-- STATISTICS -->

        <div class="stats">

            <div class="stat">

                <div class="stat-label">
                    Total Teams
                </div>

                <div
                    class="stat-value"
                    id="totalTeams">
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Pending
                </div>

                <div
                    class="stat-value"
                    id="pendingTeams">
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Completed
                </div>

                <div
                    class="stat-value"
                    id="completedTeams">
                    0
                </div>

            </div>

        </div>


        <!-- SEARCH -->

        <div class="toolbar">

            <input
                class="search"
                id="search"
                type="text"
                placeholder="Search delegation or institution..." style="color: var(--gold);">

        </div>


        <!-- TEAMS -->

        <div
            class="team-grid"
            id="teamGrid">

        </div>


    </main>



    <!-- ======================================
         TEAM MODAL
    ======================================= -->

    <div
        class="modal"
        id="teamModal">

        <div class="modal-content">


            <div class="modal-header">

                <div>

                    <h2 id="modalTitle">
                        Delegation
                    </h2>

                    <p id="modalSubtitle">
                        Edit registration
                    </p>

                </div>

                <button
                    class="close"
                    onclick="closeModal()">

                    ×

                </button>

            </div>


            <div class="editor">


                <!-- STAFF ADVISOR -->

                <div class="section">

                    <div class="section-title">
                        Staff Advisor
                    </div>

                    <div class="fields">

                        <div class="field">

                            <label>
                                Name
                            </label>

                            <input
                                id="advisorName"
                                type="text">

                        </div>


                        <div class="field">

                            <label>
                                Email
                            </label>

                            <input
                                id="advisorEmail"
                                type="email">

                        </div>


                        <div class="field">

                            <label>
                                Phone
                            </label>

                            <input
                                id="advisorPhone"
                                type="text">

                        </div>

                    </div>

                </div>


                <!-- INSTITUTION -->

                <div class="section">

                    <div class="section-title">
                        Institution
                    </div>

                    <div class="fields">

                        <div class="field">

                            <label>
                                Institution Name
                            </label>

                            <input
                                id="institutionName"
                                type="text">

                        </div>


                        <div class="field">

                            <label>
                                City
                            </label>

                            <input
                                id="institutionCity"
                                type="text">

                        </div>


                        <div class="field">

                            <label>
                                Country
                            </label>

                            <input
                                id="institutionCountry"
                                type="text">

                        </div>

                    </div>

                </div>


                <!-- DELEGATION -->

                <div class="section">

                    <div class="section-title">
                        Delegation
                    </div>

                    <div class="fields">

                        <div class="field">

                            <label>
                                Delegation Name
                            </label>

                            <input
                                id="delegationName"
                                type="text">

                        </div>


                        <div class="field">

                            <label>
                                Number of Delegates
                            </label>

                            <select id="delegateCount">

                                <option value="8">
                                    8
                                </option>

                                <option value="9">
                                    9
                                </option>

                                <option value="10">
                                    10
                                </option>

                                <option value="11">
                                    11
                                </option>

                                <option value="12">
                                    12
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- HEAD DELEGATE -->

                <div class="section">

                    <div class="section-title">
                        Head Delegate
                    </div>

                    <div class="fields">

                        <div class="field">

                            <label>
                                Name
                            </label>

                            <input
                                id="headName"
                                type="text">

                        </div>


                        <div class="field">

                            <label>
                                Committee
                            </label>

                            <input
                                id="headCommittee"
                                type="text">

                        </div>


                        <div class="field">

                            <label>
                                Email
                            </label>

                            <input
                                id="headEmail"
                                type="email">

                        </div>


                        <div class="field">

                            <label>
                                Phone
                            </label>

                            <input
                                id="headPhone"
                                type="text">

                        </div>

                    </div>

                </div>


                <!-- DELEGATES -->

                <div class="section">

                    <div class="section-title">
                        Delegates
                    </div>

                    <div id="delegatesEditor">

                    </div>

                </div>


                <!-- COUNTRY PREFERENCES -->

                <div class="section">

                    <div class="section-title">
                        Country Preferences
                    </div>

                    <div class="fields">

                        <div class="field">

                            <label>
                                1st Preference
                            </label>

                            <input
                                id="country1"
                                type="text">

                        </div>


                        <div class="field">

                            <label>
                                2nd Preference
                            </label>

                            <input
                                id="country2"
                                type="text">

                        </div>

                    </div>

                </div>


                <!-- PAYMENT -->

                <div class="section">

                    <div class="section-title">
                        Payment & Status
                    </div>

                    <div class="payment-box">

                        <div class="fields">

                            <div class="field">

                                <label>
                                    Payment Amount
                                </label>

                                <input
                                    id="money"
                                    type="number"
                                    min="0"
                                    step="0.01"
                                    placeholder="0">

                            </div>


                            <div class="field">

                                <label>
                                    Status
                                </label>

                                <select id="status">

                                    <option value="Pending">
                                        Pending
                                    </option>

                                    <option value="Payment Pending">
                                        Payment Pending
                                    </option>

                                    <option value="Confirmed">
                                        Confirmed
                                    </option>

                                    <option value="Completed">
                                        Completed
                                    </option>

                                </select>

                            </div>


                            <div class="field full">

                                <label>
                                    Payment Deadline
                                </label>

                                <input
                                    id="deadline"
                                    type="datetime-local">

                            </div>

                        </div>

                    </div>

                </div>


            </div>


            <!-- FOOTER -->

            <div class="modal-footer">

                <button
                    class="save-btn"
                    id="saveButton">

                    Save Changes

                </button>


                <button
                    class="payment-email-btn"
                    id="paymentEmailButton"
                    type="button">

                    Send Payment Email

                </button>


                <button
                    class="complete-btn"
                    id="completeButton">

                    Complete Registration ✓

                </button>

            </div>

        </div>

    </div>



    <script type="module"  src="./src/admin.js"></script>

</body>

</html>
